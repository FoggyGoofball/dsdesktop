# Wii Configuration File
# 
# Place this file at: sd:/apps/dsremote/proxy.cfg
# 
# Format: INI-style key=value pairs (no spaces around =)
# Lines starting with # are comments

# Backhaul mode: usb or wifi
# usb      = USB Ethernet adapter (recommended, low latency)
# wifi     = Wii built-in Wi-Fi (higher latency, context-switching penalty)
mode=usb

# Wi-Fi channel (1-11, only relevant if mode=wifi or for NiFi ad-hoc)
# 1, 6, 11 are standard non-overlapping channels in 2.4 GHz
channel=1

# Automatic channel calibration at startup
# 1 = enabled (benchmark candidate channels, pick lowest-latency)
# 0 = disabled (use fixed channel above)
auto_channel=1

# Candidate channels for calibration (comma-separated, no spaces)
# Typical: 1,6,11 (non-overlapping)
# Can use: 1-11 (all, but may take longer to test)
channels=1,6,11

# Number of ping probes per channel during calibration
# Higher = more accurate but slower (~probe_count × probe_timeout_ms per channel)
# Typical: 18 (good balance)
probe_count=18

# Timeout per probe in milliseconds
# Typical: 80 ms (gives ~1.5 second total calibration for 3 channels)
probe_timeout_ms=80

# PC host IP address
# Set to the IP of the machine running dsrd_host.exe
pc_ip=192.168.1.100

# PC host UDP port
# Must match --port argument on PC host (default 17394)
pc_port=17394
