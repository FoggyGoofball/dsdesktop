# Wii Configuration File
# 
# Place this file at: sd:/apps/dsremote/proxy.cfg
# 
# Format: INI-style key=value pairs (no spaces around =)
# Lines starting with # are comments

# Backhaul mode: usb or wifi
mode=usb

# Wi-Fi channel (1-11)
channel=1

# Automatic channel calibration at startup
auto_channel=1

# Candidate channels for calibration (comma-separated, no spaces)
channels=1,6,11

# Number of ping probes per channel during calibration
probe_count=18

# Timeout per probe in milliseconds
probe_timeout_ms=80

# PC host IP address
pc_ip=192.168.1.100

# PC host UDP port
pc_port=17394
